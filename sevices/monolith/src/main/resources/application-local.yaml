spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flashsale}
    username: ${DB_USER:flashsale}
    password: ${DB_PASSWORD:password}

app:
  cors:
    enabled: true
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}