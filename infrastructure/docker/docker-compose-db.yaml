services:
  postgres:
    image: postgres:16.4
    container_name: postgres_container
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: flashsale
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-flashsale}
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data: